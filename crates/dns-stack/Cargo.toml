[package]
name = "dns-stack"
version = "0.1.1"
edition = "2021"
rust-version = "1.65"
description = "A minimal DNS server and RA/RDNSS (RFC 8106) beacon backed by an application-supplied resolver. Transport-agnostic: raw packets in and out over channels, no socket or OS API of its own."
license = "Apache-2.0"
readme = "README.md"
keywords = ["dns", "ipv6", "rdnss", "rfc8106", "conditional-dns"]
categories = ["network-programming", "asynchronous"]
repository = "https://github.com/ppetr/dns-announce"
homepage = "https://github.com/ppetr/dns-announce"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
simple-dns = "0.7"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tun-rs = { version = "2", features = ["async"] }
anyhow = "1"
env_logger = "0.11"
